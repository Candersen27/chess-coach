# fly.toml app configuration file for chess-coach
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'candersen-chess-coach'
primary_region = 'ord'

[build]

[env]
  # Demo token budget caps (non-secret). Tune after watching real usage.
  PER_IP_TOKEN_CAP = "150000"
  DAILY_TOKEN_CAP = "1000000"
  # Lock CORS to the deployed origin (frontend is same-origin anyway).
  ALLOWED_ORIGINS = "https://candersen-chess-coach.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
